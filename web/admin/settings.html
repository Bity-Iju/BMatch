<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1b5e20">
  <title>Settings · BMatch Admin</title>
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="shortcut icon" type="image/png" href="assets/logo.png">
  <link rel="apple-touch-icon" href="assets/logo.png">
  <link rel="stylesheet" href="assets/admin.css">
</head>
<body>
  <div id="auth-screen" class="auth-screen" hidden>
    <form id="login-form" class="login-card">
      <div class="auth-brand"><img src="assets/logo.png" alt="BMatch logo"></div>
      <h1>BMatch Admin</h1>
      <p>Sign in with an administrator account.</p>
      <label>Email<input id="login-email" type="email" required autocomplete="username"></label>
      <label>Password<input id="login-password" type="password" required autocomplete="current-password"></label>
      <button class="primary" type="submit">Sign in</button>
      <p id="login-error" class="login-error" role="alert"></p>
    </form>
  </div>
  <div id="connection-banner" class="connection-banner" role="status"></div>
  <aside class="sidebar">
    <a class="brand" href="index.html"><span class="brand-logo"><img src="assets/logo.png" alt="BMatch logo"></span><span>BMatch <small>ADMIN</small></span></a>
    <nav aria-label="Admin navigation">
      <a class="nav-link" href="index.html" data-page="overview">Overview</a>
      <a class="nav-link" href="users.html" data-page="users">Users</a>
      <a class="nav-link" href="payments.html" data-page="payments">Payments & receipts</a>
      <a class="nav-link" href="matches.html" data-page="matches">Matches</a>
      <a class="nav-link" href="chats.html" data-page="chats">Chats</a>
      <a class="nav-link active" href="settings.html" data-page="settings">Settings</a>
    </nav>
    <div class="sidebar-footer"><span class="status-dot"></span> System operational<br><small>v1.0 • BMatch platform</small></div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div><p class="eyebrow">ADMINISTRATION</p><h1 id="page-title">Platform settings</h1></div>
      <div class="admin-user"><span class="avatar">FA</span><span><strong>Fidelis Admin</strong><small>Administrator</small></span><button class="icon-button" type="button" aria-label="Notifications">🔔</button></div>
    </header>

    <section id="settings" class="page active">
      <div class="page-heading"><div><h2>Platform settings</h2><p>Configure approval and payment review rules.</p></div></div>
      <div class="panel form-panel"><label>Payment account name<input id="payment-account-name" value="Fidelis Bitrus Ijudona"></label><label>Payment account number<input id="payment-account-number" value="9031335993"></label><label>Registration approval policy<select id="approval-policy"><option value="manual">Manual approval required</option><option value="automatic">Auto-approve after receipt verification</option></select></label><label class="switch-row"><span><strong>Email alerts</strong><small>Notify admins about new registrations and receipts</small></span><input id="email-alerts" type="checkbox" checked></label><button class="primary save-settings" type="button">Save settings</button></div>
    </section>
  </main>
  <div id="toast" class="toast" role="status"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js" onerror="this.remove()"></script>
  <script src="admin.js"></script>
</body>
</html>
